  /* 复制失败兜底弹窗 */

<script>
  const WECHAT_ID = 'caicats';
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  async function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    // iOS 需要这些属性才能正常选中
    ta.setAttribute('readonly', '');
    ta.contentEditable = 'true';
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  async function copyWechatId() {
    // 方式1：现代 Clipboard API（仅 HTTPS/localhost 可用）
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(WECHAT_ID);
        showToast('已复制微信号：caicats，请添加微信即可');
        return;
      }
    } catch (e) {}
    // 方式2：execCommand 降级
    if (await legacyCopy(WECHAT_ID)) {
      showToast('已复制微信号：caicats，请添加微信即可');
      return;
    }
    // 方式3：兜底弹窗，长按手动复制
    showFallback();
  }

  const fallback = document.getElementById('fallback');
  function showFallback() {
    fallback.classList.add('show');
  }
  fallback.addEventListener('click', (e) => {
    if (e.target === fallback || e.target.id === 'fallbackClose' || e.target.id === 'fallbackId') {
      fallback.classList.remove('show');
    }
  });

  document.getElementById('copyWechat').addEventListener('click', copyWechatId);

  // 防浏览器缓存 301 重定向：每次点击给短链加时间戳参数，强制重新解析最新目标地址
  document.querySelectorAll('a.nav-btn').forEach(link => {
    link.addEventListener('click', () => {
      const base = link.getAttribute('href').split('?')[0];
      link.setAttribute('href', base + '?t=' + Date.now());
    });
  });
</script>
